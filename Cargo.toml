[package]
name = "timer_data"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Serializer-independent data types for Bevy's Timer"
repository = "https://codeberg.org/caniko/rs-timer-data"
readme = "README.md"
keywords = ["bevy", "timer", "serialization", "gamedev"]
categories = ["game-engines", "encoding"]

[dependencies]
bevy_time = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
rkyv = { version = "0.8", optional = true }

[dev-dependencies]
bevy_time = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["bevy", "serde"]
bevy = ["dep:bevy_time"]
serde = ["dep:serde"]
rkyv = ["dep:rkyv"]
