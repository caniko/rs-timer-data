[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Plain scalars, no engine type"
description = "A timer becomes a duration in nanoseconds, the elapsed time, a finished flag and a mode enum. The stored form carries no Bevy type, so reading it back does not depend on a Timer layout."

[[pages.sections.features]]
title = "Serde helper for Timer fields"
description = "With the bevy and serde features on, the crate also works as a serde with-module: keep a real Timer in your component and let TimerData handle the serialized shape."

[[pages.sections.features]]
title = "Conversions both ways"
description = "The bevy feature adds From and Into between Timer and TimerData, so a system can restore saved state into a live timer and write it back out again without copying fields by hand."

[[pages.sections.features]]
title = "rkyv for archived state"
description = "An optional rkyv feature derives Archive, Serialize and Deserialize against rkyv 0.8. Bevy and serde are on by default; turn them off when only the plain data types are wanted."

